events {}

http {
  server {
    listen 8080;

    # The public tunnel may reach only live and test n8n webhooks. The editor,
    # REST API, credentials, and every other n8n route are intentionally hidden.
    location ~ ^/(webhook|webhook-test)(/|$) {
      proxy_pass http://n8n:5678;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      return 404;
    }
  }
}
